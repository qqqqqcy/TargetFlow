name: Release builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: targetflow-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.snapshot.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check signing configuration
        env:
          CERTIFICATE: ${{ secrets.TARGETFLOW_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.TARGETFLOW_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ vars.TARGETFLOW_SIGNING_IDENTITY }}
        run: |
          test -n "$CERTIFICATE" && test -n "$PASSWORD" && test -n "$IDENTITY" || {
            echo 'Configure TARGETFLOW_CERTIFICATE_P12, TARGETFLOW_CERTIFICATE_PASSWORD secrets and TARGETFLOW_SIGNING_IDENTITY variable.' >&2
            exit 1
          }
      - name: Calculate next patch version
        id: version
        run: python3 scripts/prepare-release.py
      - name: Commit release snapshot
        id: snapshot
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dayflow/Dayflow.xcodeproj/project.pbxproj Dayflow/Dayflow/Info.plist release.json
          git commit -m "release: $TAG"
          git tag "$TAG"
          git push origin "$TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Import persistent signing identity into temporary keychain
        timeout-minutes: 3
        env:
          CERTIFICATE: ${{ secrets.TARGETFLOW_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.TARGETFLOW_CERTIFICATE_PASSWORD }}
        run: |
          python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "signing.p12").write_bytes(base64.b64decode(os.environ["CERTIFICATE"]))'
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          KEYCHAIN="$RUNNER_TEMP/targetflow.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-certificate -c 'Activity Journal Local Signing' -p "$KEYCHAIN" > "$RUNNER_TEMP/signing.cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.cer"
          rm "$RUNNER_TEMP/signing.p12"
      - name: Build and verify DMG
        env:
          TARGETFLOW_TEST_ARCH: ${{ matrix.arch }}
          TARGETFLOW_SIGNING_IDENTITY: ${{ vars.TARGETFLOW_SIGNING_IDENTITY }}
        run: bash scripts/package-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/targetflow.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing.cer"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish release and advance release branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd dist && sha256sum -c *.sha256)
          cat > notes.md <<'NOTES'
          Requires macOS 14 or later. Choose arm64 for Apple silicon or x86_64 for Intel.

          This build uses a persistent self-signed certificate and is not notarized by Apple.
          If macOS blocks the first launch, open System Settings → Privacy & Security and choose Open Anyway.

          Configure your own AI provider.
          Installation details: docs/release-install.txt
          NOTES
          gh release create "$TAG" dist/* --title "Target Flow $VERSION" --notes-file notes.md --prerelease --verify-tag
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release
            git push --force-with-lease=refs/heads/release:$(git rev-parse FETCH_HEAD) origin HEAD:refs/heads/release
          else
            git push origin HEAD:refs/heads/release
          fi
